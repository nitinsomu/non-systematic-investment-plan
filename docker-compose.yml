services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - NSIP_ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:3020"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
